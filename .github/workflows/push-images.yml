name: Build and push images to ACR
on:
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, auth-service, event-service, registration-service, resource-service, notification-service, db]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: campusacrsruthi24.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: campusacrsruthi24.azurecr.io/campus-${{ matrix.service }}:v1
